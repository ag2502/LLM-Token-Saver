# Claude API list prices in USD per million tokens, copied from the official pricing page.
# Every token price is listed exactly as published; nothing here is derived from a multiplier.
# Partner platforms (Bedrock, Vertex AI) price separately and are not covered.

[meta]
source = "https://platform.claude.com/docs/en/about-claude/pricing"
retrieved = 2026-10-11
batch_multiplier = 0.5    # Batch API: 50% off every token type; stacks with caching
us_geo_multiplier = 1.1   # inference_geo = "us" on Claude 4.6 and later models

[models.claude-fable-5-1]
